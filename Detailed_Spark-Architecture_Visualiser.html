<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PySpark on YARN Resource City Visualiser</title>
<style>
:root{--bg:#06111b;--panel:#0a1926;--panel2:#081621;--line:#294253;--cyan:#55e6f2;--yellow:#ffd166;--pink:#ff70a6;--green:#74f0a7;--red:#ff5f68;--purple:#ae8cff;--ink:#eaf7ff;--muted:#8ba8ba}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:#f0f7fb;font-family:Inter,Segoe UI,Arial,sans-serif}.app{max-width:1500px;margin:auto;padding:20px}.header{display:flex;justify-content:space-between;gap:24px;align-items:flex-start}.eyebrow{color:var(--cyan);font-size:11px;font-weight:900;letter-spacing:.24em}.title{font-size:38px;margin:8px 0 6px;font-weight:950}.yellow{color:var(--yellow)}.sub{color:#8fa7b7;font-size:14px;line-height:1.55;max-width:850px}.rightHead{display:grid;gap:10px}.toggle{display:flex;border:1px solid #526779;background:var(--panel2);padding:4px;border-radius:16px}.toggle button{border:0;background:transparent;color:var(--muted);font-weight:900;font-size:12px;padding:10px 18px;border-radius:12px;cursor:pointer}.toggle button.active.cluster{background:var(--purple);color:#080d14}.toggle button.active.client{background:var(--cyan);color:#06111b}.total{border:1px solid #55e6f255;background:#55e6f214;padding:9px 14px;text-align:center;border-radius:12px}.total small{display:block;color:var(--cyan);font-size:9px;font-weight:900}.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:20px}.tab{border:1px solid var(--line);background:var(--panel);color:white;border-radius:12px;padding:12px;text-align:left;cursor:pointer;transition:.2s}.tab:hover{transform:translateY(-2px)}.num{font-size:9px;font-weight:900;color:var(--muted)}.tabName{font-size:10px;font-weight:900;margin-top:6px}.architecture{display:grid;grid-template-columns:3fr 3fr 6fr;gap:16px;margin-top:18px}.stack{display:grid;gap:14px;align-content:start}.card,.worker,.explain,.roadTrip{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:16px;transition:.3s}.card.active,.worker.active{transform:translateY(-4px);box-shadow:0 0 28px var(--glow);border-color:var(--accent)}.cardTitle{font-size:12px;font-weight:950;letter-spacing:.08em}.tag{font-size:9px;font-weight:900;letter-spacing:.18em;color:var(--accent)}pre{margin:12px 0 7px;background:#0005;border-radius:12px;padding:13px;color:#aef5fb;font-size:11px;line-height:1.75;overflow:auto}.small{font-size:10px;color:#758e9f;line-height:1.5}.driverParts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.part{border:1px solid #ffffff2b;background:#0003;border-radius:12px;padding:11px}.part b{font-size:11px}.part span{display:block;font-size:9px;color:#8ca3b3;margin-top:4px}.bridge{text-align:center;color:var(--cyan);font-size:10px;font-weight:900;margin:12px}.meterLabel{display:flex;justify-content:space-between;font-size:9px;color:#93a8b6}.meter{height:8px;background:#0006;border-radius:10px;overflow:hidden;margin-top:5px}.meter>span{display:block;height:100%;border-radius:10px;transition:width .5s}.notice{margin-top:11px;padding:9px;background:#0004;border-radius:9px;font-size:9px;color:#91a6b5;line-height:1.45}.warning{border-color:#ffd16655;background:#ffd1660b}.workers{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.worker{min-height:174px;padding:12px}.workerHead{display:flex;justify-content:space-between;align-items:center}.workerHead b{font-size:12px}.capacity{font-size:9px;font-weight:900;color:var(--green);background:#74f0a714;padding:5px 7px;border-radius:20px}.amBadge{margin-top:12px;border:1px solid #ae8cff66;background:#ae8cff16;color:#d7c7ff;border-radius:10px;padding:10px;text-align:center;font-size:10px;font-weight:900}.executor{margin-top:12px;border:1px solid #55e6f266;background:#55e6f212;border-radius:12px;padding:10px;animation:pop .35s}.executorHead{display:flex;justify-content:space-between;color:#aef5fb;font-size:10px;font-weight:900}.processes{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:8px 0}.process{background:#0004;border-radius:7px;padding:7px;text-align:center;font-size:9px}.python.live{background:#ff70a622;color:#ffc0d6}.clientAM{margin-top:12px;border:1px solid #55e6f266;background:#55e6f214;padding:12px;text-align:center;border-radius:12px;color:#aef5fb}.modeNote{margin-top:14px;border:1px solid #ffd16655;background:#ffd1660b;padding:12px;border-radius:12px;color:#9eb0bc;font-size:10px;line-height:1.5}.modeNote b{color:#ffe49a}.roadTrip{margin-top:18px;background:#071521}.roadTitle{font-size:13px;font-weight:950;letter-spacing:.12em}.roadWrap{position:relative;padding:48px 20px 6px}.road{position:absolute;top:62px;left:4%;right:4%;height:12px;border:1px solid #586d7c;background:#02080d;border-radius:20px}.road:after{content:"";position:absolute;left:10px;right:10px;top:50%;border-top:1px dashed #6f8290}.truck{position:absolute;top:2px;transform:translateX(-50%);transition:left .8s cubic-bezier(.2,.9,.2,1);z-index:4;text-align:center}.truckLabel{background:#000;padding:4px 7px;border-radius:5px;font-size:9px;font-weight:900;white-space:nowrap}.truckIcon{font-size:26px;animation:bob .8s infinite;filter:drop-shadow(0 0 7px currentColor)}.stops{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;position:relative;z-index:3;padding-top:36px}.stop{border:0;background:transparent;color:white;cursor:pointer;text-align:center}.dot{width:15px;height:15px;border:2px solid #607482;background:#071521;border-radius:50%;margin:auto;transition:.2s}.stopName{font-size:9px;font-weight:900;color:var(--muted);margin-top:8px}.stopNote{font-size:8px;color:#617987;line-height:1.35;margin-top:4px}.explain{margin-top:15px;min-height:150px}.explainHead{display:flex;justify-content:space-between;align-items:center}.explainHead b{font-size:13px;letter-spacing:.1em}.badge{border:1px solid currentColor;border-radius:20px;padding:5px 10px;font-size:10px;font-weight:900}.explain h3{font-size:17px;margin:22px 0 8px}.explain p{color:#b9c8d1;line-height:1.6;font-size:14px}.footer{position:sticky;bottom:10px;margin-top:15px;border:1px solid #526779aa;background:#0a1926ef;backdrop-filter:blur(12px);border-radius:17px;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:18px;box-shadow:0 13px 30px #0008}.footerTitle b{font-size:12px}.footerTitle div{font-size:11px;color:#8ea5b5;margin-top:3px}.controls{display:flex;gap:8px}.controls button{border:1px solid #617687;background:#112332;color:white;border-radius:11px;padding:10px 14px;cursor:pointer;font-weight:900}.controls .play{background:var(--cyan);color:#06202a;border-color:var(--cyan)}.progress{width:210px}.progressHead{display:flex;justify-content:space-between;font-size:9px;color:#7e95a5}.track{height:8px;background:#243542;border-radius:10px;overflow:hidden;margin-top:6px}.fill{height:100%;background:linear-gradient(90deg,var(--yellow),var(--cyan),var(--green));transition:width .4s}@keyframes pop{from{transform:scale(.78);opacity:0}}@keyframes bob{50%{transform:translateY(-3px)}}
@media(max-width:1050px){.architecture{grid-template-columns:1fr}.workers{grid-template-columns:repeat(3,1fr)}.header{flex-direction:column}.tabs{grid-template-columns:repeat(3,1fr)}.footer{position:static;flex-direction:column;align-items:stretch}.progress{width:100%}}@media(max-width:650px){.app{padding:12px}.title{font-size:27px}.workers{grid-template-columns:1fr 1fr}.stops{grid-template-columns:repeat(3,1fr);row-gap:18px}.road{display:none}.truck{display:none}.toggle{width:100%}.toggle button{flex:1;padding:9px}.driverParts{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header class="header"><div><div class="eyebrow">YARN RESOURCE CITY SIMULATOR</div><h1 class="title">PySpark on YARN: <span class="yellow">Request → Allocate → Execute</span></h1><div class="sub">Switch deployment modes and follow exactly where the Driver, ApplicationMaster and Executors live.</div></div><div class="rightHead"><div class="toggle"><button id="clusterBtn" class="cluster active" onclick="setMode('cluster')">CLUSTER MODE</button><button id="clientBtn" class="client" onclick="setMode('client')">CLIENT MODE</button></div><div class="total"><small>REQUEST TOTAL</small><b>3 × (4 cores, 30 GB)</b></div></div></header>
<nav id="tabs" class="tabs"></nav>
<section class="architecture"><div class="stack"><div id="requestCard" class="card"></div><div id="masterCard" class="card"></div></div><div class="stack"><div id="driverCard" class="card"></div><div id="clientAM"></div><div id="modeNote" class="modeNote"></div></div><div id="workers" class="workers"></div></section>
<section class="roadTrip"><div class="roadTitle">📍 ONE COMPLETE APPLICATION ROAD TRIP</div><div class="roadWrap"><div class="road"></div><div id="truck" class="truck"><div id="truckLabel" class="truckLabel"></div><div class="truckIcon">🚚</div></div><div id="stops" class="stops"></div></div></section>
<section class="explain"><div class="explainHead"><b>LIVE EXPLANATION</b><span id="explainBadge" class="badge"></span></div><div id="explainBody"></div></section>
<footer class="footer"><div class="footerTitle"><b id="footerName"></b><div id="footerNote"></div></div><div class="controls"><button onclick="resetApp()">↻</button><button id="playBtn" class="play" onclick="togglePlay()">▶ AUTO PLAY</button><button onclick="nextStep()">⏭ NEXT</button></div><div class="progress"><div class="progressHead"><span>PROGRESS</span><span id="progressText"></span></div><div class="track"><div id="progressFill" class="fill"></div></div></div></footer>
</div>
<script>
const C={cyan:'#55e6f2',yellow:'#ffd166',pink:'#ff70a6',green:'#74f0a7',red:'#ff5f68',purple:'#ae8cff',ink:'#eaf7ff',muted:'#8ba8ba'};
const clusterSteps=[
 {name:'SUBMIT',short:'spark-submit',note:'Client submits a cluster-mode request',color:C.ink},
 {name:'YARN RM',short:'ResourceManager',note:'YARN accepts and registers the application',color:C.yellow},
 {name:'AM + DRIVER',short:'Create AM container',note:'AM and Spark Driver start on a worker',color:C.purple},
 {name:'ASK RESOURCES',short:'Driver asks through AM',note:'Request 3 executors from YARN',color:C.cyan},
 {name:'ALLOCATE',short:'Create executors',note:'YARN grants 3 executor containers',color:C.pink},
 {name:'EXECUTE',short:'Schedule and run',note:'Driver schedules; executors run tasks',color:C.green}
];
const clientSteps=[
 {name:'SUBMIT',short:'spark-submit',note:'Client starts the application locally',color:C.ink},
 {name:'CLIENT DRIVER',short:'Driver on client',note:'Python main and Driver JVM stay on client',color:C.purple},
 {name:'YARN RM',short:'Contact ResourceManager',note:'Driver connects to YARN',color:C.yellow},
 {name:'AM',short:'Create lightweight AM',note:'AM coordinates executor allocation only',color:C.cyan},
 {name:'ALLOCATE',short:'Create executors',note:'YARN grants 3 executor containers',color:C.pink},
 {name:'EXECUTE',short:'Remote execution',note:'Client Driver schedules remote executors',color:C.green}
];
const chosen=[1,2,4];let mode='cluster',step=0,playing=false,timer=null;
const $=id=>document.getElementById(id);const steps=()=>mode==='cluster'?clusterSteps:clientSteps;
function meter(used,total,color,label){return `<div><div class="meterLabel"><span>${label}</span><span>${used}/${total}</span></div><div class="meter"><span style="width:${Math.min(100,used/total*100)}%;background:${color}"></span></div></div>`}
function setMode(m){mode=m;step=0;stop();render()}
function go(i){step=i;stop();render()}
function render(){const s=steps(),cur=s[step];$('clusterBtn').classList.toggle('active',mode==='cluster');$('clientBtn').classList.toggle('active',mode==='client');
 $('tabs').innerHTML=s.map((x,i)=>`<button class="tab" onclick="go(${i})" style="${i===step?`border-color:${x.color};background:${x.color}12;box-shadow:0 0 20px ${x.color}18`:''}><div class="num" style="${i===step?`color:${x.color}`:''}">${String(i+1).padStart(2,'0')}</div><div class="tabName">${x.name}</div></button>`).join('');
 $('requestCard').className='card '+(step===0?'active':'');$('requestCard').style.cssText=`--accent:${C.ink};--glow:${C.ink}25`;$('requestCard').innerHTML=`<div class="cardTitle">⌨ SPARK-SUBMIT REQUEST</div><pre>--master yarn\n--deploy-mode ${mode}\n--num-executors 3\n--executor-cores 4\n--executor-memory 30g\n--driver-memory 12g</pre><div class="small">Executors: 12 cores + 90 GB heap total, before overhead.</div>`;
 const masterActive=mode==='cluster'?[1,3,4].includes(step):[2,3,4].includes(step);$('masterCard').className='card '+(masterActive?'active':'');$('masterCard').style.cssText=`--accent:${C.yellow};--glow:${C.yellow}25`;$('masterCard').innerHTML=`<div class="tag" style="--accent:${C.yellow}">MASTER SERVICE</div><div class="cardTitle" style="margin-top:7px">📡 YARN ResourceManager</div><p class="small">Registers the application and grants containers according to capacity, queues, scheduler policy and locality.</p>${masterActive?'<div class="notice" style="color:#ffe493;background:#ffd16614;text-align:center;font-weight:900">RESOURCE NEGOTIATION ACTIVE</div>':''}`;;
 const cluster=mode==='cluster',driverActive=cluster?(step>=2&&step<=4):step>=1;$('driverCard').className='card '+(driverActive?'active':'');$('driverCard').style.cssText=`--accent:${C.purple};--glow:${C.purple}25`;$('driverCard').innerHTML=`<div class="tag" style="--accent:${C.purple}">${cluster?'WORKER-SIDE AM CONTAINER':'CLIENT / USER MACHINE'}</div><div class="cardTitle" style="margin-top:7px">${cluster?'🖥 ApplicationMaster + Driver':'💻 PySpark Driver stays on Client'}</div><div class="driverParts"><div class="part"><b>🐍 Python main()</b><span>PySpark program</span></div><div class="part"><b>☕ Driver JVM</b><span>DAG and task scheduler</span></div></div><div class="bridge">Python ⇄ Py4J ⇄ JVM</div>${meter(12,120,C.purple,'Driver heap GB')}<div class="notice">${cluster?'Client can disconnect after submission.':'Client must remain reachable for the whole application.'}</div>`;
 $('clientAM').innerHTML=!cluster?`<div class="clientAM" style="opacity:${step>=3?1:.22}">🌐<br><b>YARN APPLICATIONMASTER</b><div class="small">Negotiates executors; Driver remains on client</div></div>`:'';
 $('modeNote').innerHTML=`⚠ <b>Mode difference:</b> ${cluster?'Driver runs inside the cluster-side AM process/container.':'Driver remains on the client; AM only negotiates and monitors cluster resources.'}`;
 $('workers').innerHTML=[1,2,3,4,5,6].map(id=>{const hasExec=step>=4&&chosen.includes(id),idx=chosen.indexOf(id),hasAM=cluster&&id===5&&step>=2,active=hasExec||hasAM;return `<div class="worker ${active?'active':''} " style="--accent:${hasExec?C.cyan:C.purple};--glow:${hasExec?C.cyan:C.purple}20"><div class="workerHead"><b>Worker ${id}</b><span class="capacity">32 cores · 120 GB</span></div>${hasAM?'<div class="amBadge">AM + DRIVER<br>12 GB heap</div>':''}${hasExec?`<div class="executor"><div class="executorHead"><span>EXECUTOR ${idx+1}</span><span>▣</span></div><div class="processes"><div class="process">☕ JVM<br><b>4 task slots</b></div><div class="process python ${step===5?'live':''}">'🐍' Python worker<br><b>${step===5?'when needed':'on demand'}</b></div></div>${meter(4,32,C.cyan,'Cores')}${meter(30,120,C.green,'Heap GB')}</div>`:''}</div>`}).join('');
 const pos=4+(step/(s.length-1))*92;$('truck').style.left=pos+'%';$('truck').style.color=cur.color;$('truckLabel').textContent=cur.short;$('truckLabel').style.color=cur.color;$('stops').innerHTML=s.map((x,i)=>`<button class="stop" onclick="go(${i})"><div class="dot" style="border-color:${i===step?x.color:'#607482'};background:${i<=step?x.color:'#071521'};${i===step?`box-shadow:0 0 15px ${x.color}`:''}"></div><div class="stopName" style="${i===step?`color:${x.color}`:''}">${i+1}. ${x.short}</div><div class="stopNote">${x.note}</div></button>`).join('');
 const text=cluster?[
 ['The request leaves the client','spark-submit sends the application, files and resource configuration to YARN.'],['YARN ResourceManager accepts it','The scheduler finds an eligible worker for the ApplicationMaster container.'],['AM and Driver start together','In cluster mode, Python main and the Driver JVM run in the cluster-side AM container.'],['The application asks for executors','The AM negotiates 3 containers, each requesting 4 cores and 30 GB executor heap.'],['YARN creates executor containers','This simulation places executors on Workers 1, 2 and 4. Placement follows scheduler rules, not pure randomness.'],['Driver schedules; executors execute','The Driver sends tasks across 12 task slots. Executor JVMs use Python workers only when Python execution is required.']
 ]:[['The request starts on the client','spark-submit launches Python main and the Driver JVM on the client machine.'],['Driver stays outside the cluster','The client hosts the 12 GB Driver and must remain network-reachable.'],['Driver contacts YARN','The client-side Driver requests cluster resources from the ResourceManager.'],['YARN starts an ApplicationMaster','The AM negotiates executor containers, but does not contain the Spark Driver in client mode.'],['YARN creates executor containers','Three executors are launched on Workers 1, 2 and 4, each with 4 cores and 30 GB heap.'],['Client Driver schedules remote work','Tasks travel from the client Driver to executor JVMs. Results and status return to the client Driver.']];
 $('explainBadge').textContent=`STEP ${step+1}/6 · ${mode.toUpperCase()} MODE`;$('explainBadge').style.color=cur.color;$('explainBody').innerHTML=`<h3 style="color:${cur.color}">${text[step][0]}</h3><p>${text[step][1]}</p>`;
 $('footerName').textContent=cur.name;$('footerName').style.color=cur.color;$('footerNote').textContent=cur.note;const pct=Math.round((step+1)/6*100);$('progressText').textContent=pct+'%';$('progressFill').style.width=pct+'%';}
function nextStep(){if(step<5){step++;render()}else stop()}function resetApp(){step=0;stop();render()}function togglePlay(){playing=!playing;$('playBtn').textContent=playing?'⏸ PAUSE':'▶ AUTO PLAY';if(playing)timer=setInterval(()=>{if(step<5){step++;render()}else stop()},2700);else stop()}function stop(){playing=false;clearInterval(timer);timer=null;$('playBtn').textContent='▶ AUTO PLAY'}
render();
</script>
</body>
</html>
